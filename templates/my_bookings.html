
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Table | Royal Snooker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #071b16;
            color: white;
        }

        .booking-container {
            max-width: 550px;
            margin: 30px auto;
            padding: 35px;
            background: #123c2d;
            border-radius: 15px;
            box-shadow: 0 5px 25px #0008;
        }

        h1, h2 {
            text-align: center;
        }

        h1 {
            color: #e8c46a;
        }

        .welcome {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
        }

        input, select {
            display: block;
            width: 100%;
            height: 48px;
            padding: 10px 12px;
            border: 2px solid #d6bd75;
            border-radius: 7px;
            background: white;
            color: #222;
            font-size: 16px;
            cursor: text;
        }

        select {
            cursor: pointer;
        }

        input:focus, select:focus {
            outline: 3px solid #e8c46a;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #e8c46a;
            color: #17251e;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ffdc83;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: #f5d77c;
            margin: 0 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="booking-container">

    <h1>🎱 ROYAL SNOOKER</h1>
    <h2>BOOK YOUR TABLE</h2>
    <h2 style="color:red;">TEST NEW BOOKING PAGE</h2>

    <p class="welcome">Welcome, {{ request.user.username }}!</p>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="customer_name">Customer Name</label>
            <input
                type="text"
                id="customer_name"
                name="customer_name"
                placeholder="Enter your name"
                required>
        </div>

        <div class="form-group">
            <label for="table">Select Snooker Table</label>
            <select id="table" name="table" required>
                <option value="">Choose a table</option>
                {% for table in tables %}
                    <option value="{{ table.id }}">
                        {{ table }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="booking_date">Booking Date</label>
            <input
                type="date"
                id="booking_date"
                name="booking_date"
                required>
        </div>

        <div class="form-group">
            <label for="starting_time">Starting Time</label>
            <input
                type="time"
                id="starting_time"
                name="starting_time"
                required>
        </div>

        <div class="form-group">
            <label for="duration">Duration</label>
            <select id="duration" name="duration" required>
                <option value="">Select duration</option>
                <option value="1">1 Hour</option>
                <option value="2">2 Hours</option>
                <option value="3">3 Hours</option>
                <option value="4">4 Hours</option>
            </select>
        </div>

        <button type="submit">CONFIRM BOOKING</button>
    </form>

    <div class="links">
        <a href="{% url 'my_bookings' %}">My Bookings</a>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

</div>

</body>
</html>
