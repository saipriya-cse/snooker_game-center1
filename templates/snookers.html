
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Snooker Arena</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header class="header">
    <h1>ROYAL SNOOKER ARENA</h1>
    <span class="ready">● GAME READY</span>
</header>

<main class="game-layout">

    <section class="score-panel">
        <h2>MATCH SCORE</h2>

        <div class="player active" id="player1">
            <h3>PLAYER 1</h3>
            <div class="score" id="score1">0</div>
            <p id="status1">YOUR TURN</p>
        </div>

        <div class="player" id="player2">
            <h3>PLAYER 2</h3>
            <div class="score" id="score2">0</div>
            <p id="status2">WAITING</p>
        </div>
    </section>

    <section class="table-container">
        <canvas id="snookerTable" width="1000" height="520"></canvas>
    </section>

    <section class="instructions">
        <h4>HOW TO PLAY</h4>
        <p>Move mouse over table: Aim</p>
        <p>Click STRIKE BALL: Shoot</p>
        <p>Use Up / Down: Adjust power</p>
    </section>

    <section class="control-panel">
        <h2>SHOT CONTROL</h2>

        <label>
            SHOT POWER:
            <span id="powerValue">13%</span>
        </label>

        <input
            type="range"
            id="power"
            min="5"
            max="100"
            value="13"
        >

        <button id="strikeBtn">STRIKE BALL</button>
        <button id="resetBtn" class="reset">RESET TABLE</button>

        <p id="message">Player 1's turn. Move your mouse to aim and strike.</p>
    </section>

</main>

<script src="{% static 'js/snooker.js' %}" defer></script>
</body>
</html>
