
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Table | Royal Snooker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #071b16;
            color: white;
        }

        .booking-container {
            width: 100%;
            max-width: 550px;
            margin: 20px auto;
            padding: 35px;
            background: #123c2d;
            border: 1px solid #d6bd75;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        h1, h2 {
            text-align: center;
        }

        h1 {
            color: #e8c46a;
            font-size: 30px;
        }

        h2 {
            margin-bottom: 25px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 30px;
            color: #f5d77c;
        }

        .form-group {
            display: block;
            width: 100%;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        select {
            display: block;
            width: 100%;
            height: 50px;
            padding: 12px;
            border: 2px solid #d6bd75;
            border-radius: 7px;
            background-color: #ffffff;
            color: #222222;
            font-size: 16px;
            visibility: visible;
            opacity: 1;
        }

        input:focus,
        select:focus {
            outline: 3px solid #e8c46a;
            border-color: #e8c46a;
        }

        button {
            display: block;
            width: 100%;
            height: 52px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #e8c46a;
            color: #17251e;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ffdc83;
        }

        .messages {
            padding: 0;
            list-style: none;
        }

        .messages li {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            background: #f5d77c;
            color: #222;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            display: inline-block;
            margin: 8px;
            color: #f5d77c;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .booking-container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="booking-container">

    <h1>🎱 ROYAL SNOOKER</h1>
    <h2>BOOK YOUR TABLE</h2>

    <p class="welcome">
        Welcome, {{ request.user.username }}!
    </p>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="POST" action="">
        {% csrf_token %}

        <!-- CUSTOMER NAME -->
        <div class="form-group">
            <label for="customer_name">Customer Name</label>
            <input
                type="text"
                id="customer_name"
                name="customer_name"
                value="{{ request.user.username }}"
                placeholder="Enter customer name"
                required>
        </div>

        <!-- TABLE SELECTION -->
        <div class="form-group">
            <label for="table">Select Snooker Table</label>

            <select id="table" name="table" required>
                <option value="">Choose a table</option>

                {% for table in tables %}
                    <option value="{{ table.id }}">
                        {{ table }}
                    </option>
                {% empty %}
                    <option value="" disabled>
                        No tables available
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- BOOKING DATE -->
        <div class="form-group">
            <label for="booking_date">Booking Date</label>

            <input
                type="date"
                id="booking_date"
                name="booking_date"
                min="{% now 'Y-m-d' %}"
                required>
        </div>

        <!-- STARTING TIME -->
        <div class="form-group">
            <label for="start_time">Starting Time</label>

            <input
                type="time"
                id="start_time"
                name="start_time"
                required>
        </div>

        <!-- DURATION -->
        <div class="form-group">
            <label for="duration">Duration</label>

            <select id="duration" name="duration" required>
                <option value="">Select duration</option>
                <option value="60">1 Hour</option>
                <option value="120">2 Hours</option>
                <option value="180">3 Hours</option>
                <option value="240">4 Hours</option>
            </select>
        </div>

        <button type="submit">
            CONFIRM BOOKING
        </button>

    </form>

    <div class="links">
        <a href="{% url 'my_bookings' %}">My Bookings</a>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

</div>

</body>
</html>
