
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Snooker Arena</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #07100d;
            color: white;
            font-family: Arial, sans-serif;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px 25px;
            background: #10251b;
            border-bottom: 2px solid #c5a34a;
        }

        .brand {
            color: #e5c46b;
            font-size: 24px;
            font-weight: bold;
        }

        .score-box {
            color: #e5c46b;
            font-size: 20px;
            font-weight: bold;
        }

        .game-container {
            width: 100%;
            max-width: 1250px;
            margin: 25px auto;
            padding: 15px;
        }

        .game-heading {
            color: #e5c46b;
            text-align: center;
        }

        .instructions {
            text-align: center;
            color: #ddd;
            line-height: 1.6;
        }

        .table-container {
            width: 100%;
            overflow: hidden;
            border: 4px solid #c5a34a;
            border-radius: 12px;
            background: #087443;
            box-shadow: 0 10px 35px rgba(0,0,0,.6);
        }

        #snookerTable {
            display: block;
            width: 100%;
            height: auto;
            cursor: crosshair;
            touch-action: none;
        }

        /* LOADING SCREEN */
        #loading {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            background: #07100d;
            color: #e5c46b;
            font-size: 25px;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
        }

        .controls button {
            padding: 13px 25px;
            background: #c5a34a;
            color: #111;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .controls button:hover {
            background: #e5c46b;
        }

        #gameStatus {
            text-align: center;
            color: #e5c46b;
            margin-top: 20px;
            min-height: 25px;
        }

        .bottom-links {
            text-align: center;
            margin: 30px 0;
        }

        .bottom-links a {
            color: #e5c46b;
            margin: 0 10px;
            text-decoration: none;
        }

        @media(max-width:600px) {
            .brand {
                font-size: 18px;
            }

            .game-container {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

    <div id="loading">
        Loading Royal Snooker Arena...
    </div>

    <header class="topbar">
        <div class="brand">ROYAL SNOOKER ARENA</div>

        <div class="score-box">
            SCORE: <span id="scoreValue">0</span>
        </div>
    </header>

    <main class="game-container">

        <h2 class="game-heading">Welcome to Royal Snooker</h2>

        <p class="instructions">
            Move your mouse to aim.
            Click and drag to set your shot, then release to shoot.
        </p>

        <div class="table-container">
            <canvas
                id="snookerTable"
                width="1100"
                height="620">
            </canvas>
        </div>

        <div class="controls">
            <button id="resetButton" type="button">
                RESET GAME
            </button>

            <button id="homeButton" type="button">
                BACK TO HOME
            </button>
        </div>

        <div id="gameStatus">
            Game ready! Aim and take your shot.
        </div>

        <div class="bottom-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'my_bookings' %}">My Bookings</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>

    </main>

    <script defer src="{% static 'js/snooker.js' %}"></script>

</body>
</html>
