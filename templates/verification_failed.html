
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - Royal Snooker</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #07100d;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 35px;
            text-align: center;
            background: #14251d;
            border: 1px solid #c5a34a;
            border-radius: 15px;
            box-sizing: border-box;
        }

        h1 {
            color: #e5c46b;
        }

        p {
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: #c5a34a;
            color: #111;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Verification Failed</h1>

        <p>{{ error }}</p>

        <a href="{% url 'register' %}">Register Again</a>
    </div>
</body>
</html>
