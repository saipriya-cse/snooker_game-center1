
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Royal Snooker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #07100d, #153b29);
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 430px;
            background: #10251b;
            padding: 35px;
            border: 1px solid #c5a34a;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,.5);
        }

        h1 {
            text-align: center;
            color: #e5c46b;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #f1d994;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            height: 45px;
            padding: 10px 12px;
            border: 1px solid #c5a34a;
            border-radius: 6px;
            background: #fff;
            color: #111;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border: 2px solid #e5c46b;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #c5a34a;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e5c46b;
        }

        .links {
            text-align: center;
            margin-top: 22px;
            line-height: 2;
        }

        a {
            color: #e5c46b;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .messages {
            color: #ffaaaa;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="register-container">

    <h1>ROYAL SNOOKER</h1>
    <h2>CREATE ACCOUNT</h2>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email address"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <label for="confirm_password">Confirm Password</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm password"
            required
        >

        <button type="submit">REGISTER</button>
    </form>

    <div class="links">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>

        <br>

        <a href="{% url 'home' %}">Back to Home</a>
    </div>

</div>

</body>
</html>
